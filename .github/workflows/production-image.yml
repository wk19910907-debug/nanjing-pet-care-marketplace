name: Validate production image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - scripts/production-deployment-files.test.mjs
      - package.json
      - pnpm-lock.yaml
      - apps/**
      - packages/**
      - prisma/**
      - .github/workflows/production-image.yml
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/**
      - scripts/production-deployment-files.test.mjs
      - package.json
      - pnpm-lock.yaml
      - apps/**
      - packages/**
      - prisma/**
      - .github/workflows/production-image.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:deploy
      - name: Validate Compose configuration
        run: |
          cp deploy/.env.production.example deploy/.env.production
          docker compose --env-file deploy/.env.production \
            --file deploy/compose.production.yml config --quiet
      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            --env SITE_DOMAIN=pet.example.com \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker build --tag nanjing-petcare:ci .
