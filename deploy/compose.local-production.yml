name: nanjing-petcare-local-production

services:
  postgres:
    image: postgres:16.10-alpine3.22@sha256:ab8380566c3ea09690a9ecaa85a59d82bfc6eb86744151a2a54335866c83a3e9
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in the local production environment file}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the local production environment file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the local production environment file}
    ports:
      - "127.0.0.1:${POSTGRES_MAINTENANCE_PORT:?set POSTGRES_MAINTENANCE_PORT in the local production environment file}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      backend:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:3f97c5651cb6662b880c787a232b6b34fec8d8922e08d6617b25d241a21164bb
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the local production environment file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the local production environment file}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      backend:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z@sha256:2582c2f48b1e31545143ba5285c67d7b38c8b8f6912142d0630686dc7aaac28b
    restart: "no"
    entrypoint: ["/bin/sh", "/usr/local/bin/minio-init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in the local production environment file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in the local production environment file}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in the local production environment file}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in the local production environment file}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in the local production environment file}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./local-production/minio-init.sh:/usr/local/bin/minio-init.sh:ro
    tmpfs:
      - /config:size=64m,mode=1777
    networks:
      backend:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: nanjing-petcare:local
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:?set NODE_ENV in the local production environment file}
      PILOT_MODE: ${PILOT_MODE:?set PILOT_MODE in the local production environment file}
      PILOT_SHARED_INGRESS_RATE_LIMITING: ${PILOT_SHARED_INGRESS_RATE_LIMITING:?set PILOT_SHARED_INGRESS_RATE_LIMITING in the local production environment file}
      PILOT_PUBLIC_ORIGIN: ${PILOT_PUBLIC_ORIGIN:?set PILOT_PUBLIC_ORIGIN in the local production environment file}
      PILOT_AUTH_PEPPER: ${PILOT_AUTH_PEPPER:?set PILOT_AUTH_PEPPER in the local production environment file}
      PILOT_HOST: 0.0.0.0
      PILOT_PORT: "3000"
      PILOT_TRUST_PROXY: 172.31.0.2
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in the local production environment file}
      FIELD_ENCRYPTION_KEY_V1: ${FIELD_ENCRYPTION_KEY_V1:?set FIELD_ENCRYPTION_KEY_V1 in the local production environment file}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in the local production environment file}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT in the local production environment file}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in the local production environment file}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in the local production environment file}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in the local production environment file}
      S3_REGION: ${S3_REGION:?set S3_REGION in the local production environment file}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    networks:
      backend:
        ipv4_address: 172.31.0.3
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  postgres_data:
  minio_data:
