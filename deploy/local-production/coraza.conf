# Coraza's embedded CRS files become available through load_owasp_crs.
Include @coraza.conf-recommended
Include @crs-setup.conf.example

# Begin with the least aggressive CRS policy for the local production rehearsal.
SecAction "id:900000,phase:1,pass,nolog,setvar:tx.paranoia_level=1"

# JSON API payloads are intentionally small. Reject bodies exceeding one MiB.
SecRequestBodyLimit 1048576
SecRequestBodyNoFilesLimit 1048576

Include @owasp_crs/*.conf
SecRuleEngine On
