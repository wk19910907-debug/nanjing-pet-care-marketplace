services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: petcare
      POSTGRES_DB: petcare
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare -d petcare"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - petcare_postgres:/var/lib/postgresql/data

volumes:
  petcare_postgres:
